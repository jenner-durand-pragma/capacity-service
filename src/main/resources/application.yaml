management:
  tracing:
    sampling:
      probability: 0.0
    baggage:
      correlation:
        fields:
          - messageId
          - x-message-id
      remote-fields: messageId,x-message-id
  endpoints:
    web:
      exposure:
        include: health, metrics, loggers
      base-path: /
      path-mapping:
        health: actuator/health
        metrics: actuator/metrics
        loggers: capacity-service/actuator/loggers
  endpoint:
    health:
      probes:
        enabled: false
      show-details: "always"
  health:
    diskspace:
      enabled: false
    r2dbc:
      enabled: true
    ping:
      enabled: false
    refresh:
      enabled: false

technology-service:
  base-url: "${TECHNOLOGY_SERVICE_BASE_URL}"
  timeout: "${TECHNOLOGY_SERVICE_TIMEOUT}"
resilience4j:
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 2000ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2.0
        maxWaitDuration: 10000ms  # Duración máxima del backoff
        initialInterval: 500ms    # Intervalo inicial para el backoff
    instances:
      technologyServiceRetry:
        maxAttempts: 5
        waitDuration: 1000ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 1.5
        maxWaitDuration: 10000ms  # Duración máxima del backoff
        initialInterval: 500ms    # Intervalo inicial para el backoff
#        retry-exceptions:
#          - com.example.capacity.infrastructure.adapters.technologyservice.exceptions.TechnologyServiceUnavailableException
        ignore-exceptions:
          - com.example.capacity.infrastructure.adapters.technologyservice.exceptions.TechnologyServiceBusinessException
          - com.example.capacity.infrastructure.adapters.technologyservice.exceptions.TechnologyNotFoundException
  bulkhead:
    configs:
      default:
        maxConcurrentCalls: 10
        maxWaitDuration: 500ms
    instances:
      technologyServiceBulkhead:
        maxConcurrentCalls: 5
        maxWaitDuration: 1s
